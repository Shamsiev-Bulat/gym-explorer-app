<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FitExercises</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #1a1a1a;
            --primary-color: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 40px;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--primary-color); }

        .lang-select {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .filters {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input, .filter-select {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-input:focus, .filter-select:focus {
            border-color: var(--primary-color);
        }

        .fav-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .fav-toggle-btn.active {
            border-color: var(--primary-color);
            background: rgba(0, 230, 118, 0.1);
            color: var(--primary-color);
        }

        .exercise-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-card {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            transition: transform 0.1s, background 0.2s;
            cursor: pointer;
            position: relative;
        }

        .exercise-card:active {
            transform: scale(0.98);
            background: #252525;
        }

        .card-image {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #2a2a2a;
            flex-shrink: 0;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-content h3 {
            margin: 0 0 6px 0;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 30px; /* Место для кнопки избранного */
        }

        .card-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .badge {
            background: rgba(0, 230, 118, 0.15);
            color: var(--primary-color);
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
            text-transform: capitalize;
        }

        .target {
            margin: 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .fav-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
            z-index: 10;
        }

        .fav-btn:active {
            transform: scale(1.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 998;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 92vh;
            overflow-y: auto;
            z-index: 999;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .modal.active {
            transform: translateY(0);
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: #444;
            border-radius: 2px;
            margin: 12px auto;
        }

        .modal-header {
            padding: 0 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            flex: 1;
            padding-right: 16px;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-media {
            padding: 20px;
            text-align: center;
            background: #000;
        }

        .modal-media img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
        }

        .modal-info {
            padding: 20px;
        }

        .meta-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag {
            background: #333;
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            text-transform: capitalize;
        }

        .target-tag {
            background: rgba(0, 230, 118, 0.2);
            color: var(--primary-color);
        }

        .secondary {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-info h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .steps-list {
            padding-left: 20px;
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 15px;
        }

        .steps-list li {
            margin-bottom: 10px;
        }

        .instruction-text {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 15px;
        }

        .attribution {
            margin-top: 24px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <h1>FitExercises</h1>
    <select class="lang-select" id="lang-select">
        <option value="ru">🇷🇺 Русский</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="tr">🇹🇷 Türkçe</option>
    </select>
</header>

<main>
    <div class="filters">
        <input type="text" class="search-input" id="search" placeholder="Поиск упражнения (например: press)">
        <select class="filter-select" id="filter-category">
            <option value="">Все группы мышц</option>
        </select>
        <select class="filter-select" id="filter-equipment">
            <option value="">Всё оборудование</option>
        </select>
        <button class="filter-select fav-toggle-btn" id="fav-toggle">
            <span id="fav-icon">🤍</span> 
            <span>Только избранное</span> 
            (<span id="fav-count">0</span>)
        </button>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        Загрузка базы упражнений...
    </div>
    
    <div id="exercise-list" class="exercise-list"></div>
</main>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
        <h2 id="modal-title">Exercise Name</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-media">
        <img id="modal-gif" src="" alt="Exercise animation">
    </div>
    <div class="modal-info" id="modal-info">
        <!-- Dynamic content -->
    </div>
</div>

<script>
    const BASE_URL = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
    let exercises = [];
    let currentLang = 'ru';
    let favorites = JSON.parse(localStorage.getItem('favExercises')) || [];
    let showFavoritesOnly = false;
    let currentFilteredExercises = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        
        document.getElementById('search').addEventListener('input', filterExercises);
        document.getElementById('filter-category').addEventListener('change', filterExercises);
        document.getElementById('filter-equipment').addEventListener('change', filterExercises);
        
        document.getElementById('fav-toggle').addEventListener('click', () => {
            showFavoritesOnly = !showFavoritesOnly;
            const btn = document.getElementById('fav-toggle');
            const icon = document.getElementById('fav-icon');
            
            if (showFavoritesOnly) {
                btn.classList.add('active');
                icon.textContent = '❤️';
            } else {
                btn.classList.remove('active');
                icon.textContent = '🤍';
            }
            filterExercises();
        });

        document.getElementById('lang-select').addEventListener('change', (e) => {
            currentLang = e.target.value;
            filterExercises();
        });
    });

    async function loadData() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json');
            exercises = await response.json();
            populateFilters();
            updateFavCount();
            filterExercises();
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            document.getElementById('loading').innerHTML = '❌ Ошибка загрузки данных.<br>Проверьте подключение к интернету.';
            console.error(error);
        }
    }

    function updateFavCount() {
        document.getElementById('fav-count').textContent = favorites.length;
    }

    function toggleFavorite(id, event) {
        event.stopPropagation(); // Предотвращаем открытие модального окна при клике на сердце
        
        if (favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }
        
        localStorage.setItem('favExercises', JSON.stringify(favorites));
        updateFavCount();
        
        // Перерисовываем текущий отфильтрованный список, чтобы обновить иконки
        renderExercises(currentFilteredExercises);
    }

    function populateFilters() {
        const categories = [...new Set(exercises.map(ex => ex.category))].sort();
        const equipments = [...new Set(exercises.map(ex => ex.equipment))].sort();
        
        const catSelect = document.getElementById('filter-category');
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
            catSelect.appendChild(opt);
        });
        
        const eqSelect = document.getElementById('filter-equipment');
        equipments.forEach(eq => {
            const opt = document.createElement('option');
            opt.value = eq;
            opt.textContent = eq.charAt(0).toUpperCase() + eq.slice(1);
            eqSelect.appendChild(opt);
        });
    }

    function filterExercises() {
        const search = document.getElementById('search').value.toLowerCase();
        const equipment = document.getElementById('filter-equipment').value;
        const category = document.getElementById('filter-category').value;

        const filtered = exercises.filter(ex => {
            const nameMatch = ex.name.toLowerCase().includes(search);
            const instrMatch = ex.instructions[currentLang]?.toLowerCase().includes(search) || 
                               ex.instructions['en']?.toLowerCase().includes(search);
            const matchEquip = equipment ? ex.equipment === equipment : true;
            const matchCat = category ? ex.category === category : true;
            const matchFav = showFavoritesOnly ? favorites.includes(ex.id) : true;
            
            return (nameMatch || instrMatch) && matchEquip && matchCat && matchFav;
        });

        currentFilteredExercises = filtered;
        renderExercises(filtered);
    }

    function renderExercises(list) {
        const container = document.getElementById('exercise-list');
        container.innerHTML = '';
        
        if (list.length === 0) {
            const msg = showFavoritesOnly ? 'В избранном пока ничего нет. Нажмите 🤍, чтобы добавить.' : 'Упражнения не найдены';
            container.innerHTML = `<div class="no-results">${msg}</div>`;
            return;
        }

        const displayList = list.slice(0, 100);
        const fragment = document.createDocumentFragment();
        
        displayList.forEach(ex => {
            const card = document.createElement('div');
            card.className = 'exercise-card';
            card.onclick = () => openModal(ex);
            
            const imgUrl = BASE_URL + ex.image;
            const isFav = favorites.includes(ex.id);
            
            card.innerHTML = `
                <img src="${imgUrl}" alt="${ex.name}" class="card-image" loading="lazy">
                <div class="card-content">
                    <h3>${ex.name}</h3>
                    <div class="card-meta">
                        <span class="badge">${ex.category}</span>
                        <span class="badge">${ex.equipment}</span>
                    </div>
                    <p class="target">Цель: ${ex.target}</p>
                </div>
                <button class="fav-btn" onclick="toggleFavorite('${ex.id}', event)" aria-label="Добавить в избранное">
                    ${isFav ? '❤️' : '🤍'}
                </button>
            `;
            fragment.appendChild(card);
        });
        
        container.appendChild(fragment);
        
        if (list.length > 100) {
            const more = document.createElement('div');
            more.className = 'no-results';
            more.textContent = `Показано 100 из ${list.length}. Уточните поиск.`;
            container.appendChild(more);
        }
    }

    function openModal(ex) {
        const modal = document.getElementById('modal');
        const overlay = document.getElementById('modal-overlay');
        const info = document.getElementById('modal-info');
        
        document.getElementById('modal-title').textContent = ex.name;
        
        const imgUrl = BASE_URL + ex.image;
        const gifUrl = BASE_URL + ex.gif_url;
        const gifEl = document.getElementById('modal-gif');
        
        gifEl.src = gifUrl;
        gifEl.onerror = function() {
            this.src = imgUrl;
        };

        const steps = ex.instruction_steps?.[currentLang] || ex.instruction_steps?.['en'] || [];
        const instructionText = ex.instructions?.[currentLang] || ex.instructions?.['en'] || 'Инструкция недоступна';

        let stepsHtml = '';
        if (steps.length > 0) {
            stepsHtml = '<ol class="steps-list">' + steps.map(step => `<li>${step}</li>`).join('') + '</ol>';
        } else {
            stepsHtml = `<p class="instruction-text">${instructionText}</p>`;
        }

        const secondary = ex.secondary_muscles ? ex.secondary_muscles.join(', ') : 'Нет данных';

        info.innerHTML = `
            <div class="meta-tags">
                <span class="tag">${ex.category}</span>
                <span class="tag">${ex.equipment}</span>
                <span class="tag target-tag">Цель: ${ex.target}</span>
            </div>
            <p class="secondary">Вторичные мышцы: ${secondary}</p>
            <h3>Инструкция</h3>
            ${stepsHtml}
            <p class="attribution">${ex.attribution}</p>
        `;
        
        modal.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
        document.getElementById('modal-overlay').classList.remove('active');
        document.body.style.overflow = '';
    }
</script>

</body>
</html>

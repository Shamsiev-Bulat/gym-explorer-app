<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FitExercises</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <h1>FitExercises</h1>
    <div class="header-controls">
        <select class="lang-select" id="lang-select">
            <option value="ru">🇺 Русский</option>
            <option value="en">🇬 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="tr">🇹 Türkçe</option>
        </select>
        <button class="btn-workout-mode" id="btn-workout-mode">🏋️ Тренировка</button>
    </div>
</header>

<main>
    <div class="filters">
        <input type="text" class="search-input" id="search" placeholder="Поиск упражнения (например: press)">
        <select class="filter-select" id="filter-category">
            <option value="">Все группы мышц</option>
        </select>
        <select class="filter-select" id="filter-equipment">
            <option value="">Всё оборудование</option>
        </select>
        <button class="filter-select fav-toggle-btn" id="fav-toggle">
            <span id="fav-icon">🤍</span> 
            <span>Только избранное</span> 
            (<span id="fav-count">0</span>)
        </button>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        Загрузка базы упражнений...
    </div>
    
    <div id="error-log-container" class="error-log-container" style="display: none;">
        <h3> Лог ошибок:</h3>
        <pre id="error-log"></pre>
        <button class="btn-primary" onclick="document.getElementById('error-log-container').style.display='none'">Закрыть</button>
    </div>
    
    <div id="exercise-list" class="exercise-list"></div>
    
    <div id="workout-container" class="workout-container" style="display: none;"></div>
</main>

<div class="modal-overlay" id="modal-overlay"></div>
<div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
        <h2 id="modal-title">Exercise Name</h2>
        <button class="close-btn" id="modal-close">&times;</button>
    </div>
    <div class="modal-media">
        <img id="modal-gif" src="" alt="Exercise animation">
    </div>
    <div class="modal-info" id="modal-info"></div>
</div>

<script type="module" src="js/logger.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
